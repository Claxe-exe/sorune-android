<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; img-src https: data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src https://geocoding-api.open-meteo.com https://api.open-meteo.com; base-uri 'none'; form-action 'none'">
    <title>Yeni sekme</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="newtab.css">
</head>
<body>
    <div class="wall" id="wall"></div>
    <div class="shade"></div>
    <canvas class="effects" id="effects" aria-hidden="true"></canvas>

    <main class="page">
        <p class="greeting" id="greeting"></p>
        <h1 class="clock" id="clock"></h1>
        <p class="date" id="date"></p>

        <form class="search" id="search" autocomplete="off">
            <input type="search" id="query" enterkeyhint="go" placeholder="Ara veya adres yaz" aria-label="Ara veya adres yaz">
        </form>

        <nav class="shortcuts" id="shortcuts" aria-label="Kısayollar"></nav>
        <div class="edit-row">
            <button type="button" class="edit-toggle" id="edit" aria-label="Kısayolları düzenle">✎ Düzenle</button>
            <label class="glass-row">
                <span>Kart koyuluğu <b id="glass-value"></b></span>
                <input type="range" id="glass" min="0" max="90" step="5" aria-label="Kart koyuluğu">
            </label>
        </div>

        <section class="widgets" id="widgets"></section>

        <form class="add-form" id="add-form" autocomplete="off" hidden>
            <input type="text" id="add-name" maxlength="24" placeholder="Ad, ör. Webtoon" aria-label="Kısayol adı">
            <input type="text" id="add-url" placeholder="Adres, ör. webtoons.com" aria-label="Kısayol adresi" inputmode="url">
            <div class="add-buttons">
                <button type="button" class="ghost" id="add-cancel">Vazgeç</button>
                <button type="submit" class="solid">Ekle</button>
            </div>
        </form>
    </main>

    <script src="bridge.js"></script>
    <script src="newtab.js"></script>
</body>
</html>
