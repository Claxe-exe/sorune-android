<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; img-src https: data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Yeni sekme</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="newtab.css">
</head>
<body>
    <div class="wall" id="wall"></div>
    <div class="shade"></div>

    <main class="page">
        <p class="greeting" id="greeting"></p>
        <h1 class="clock" id="clock"></h1>
        <p class="date" id="date"></p>

        <form class="search" id="search" autocomplete="off">
            <input type="search" id="query" enterkeyhint="go" placeholder="Ara veya adres yaz" aria-label="Ara veya adres yaz">
        </form>

        <nav class="shortcuts" id="shortcuts" aria-label="Kısayollar"></nav>
    </main>

    <script src="bridge.js"></script>
    <script src="newtab.js"></script>
</body>
</html>
